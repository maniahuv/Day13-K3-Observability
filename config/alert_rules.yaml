alerts:
  - name: High user-facing latency
    severity: page
    condition: latency_p95_ms > 3000 for 5 minutes
    type: symptom-based
    owner: on-call-support
    runbook: docs/alerts.md#alert-1
  - name: Elevated chat error rate
    severity: page
    condition: error_rate_pct > 2 for 5 minutes
    type: symptom-based
    owner: on-call-support
    runbook: docs/alerts.md#alert-2
  - name: Quality proxy below SLO
    severity: ticket
    condition: quality_score_avg < 0.75 for 15 minutes
    type: symptom-based
    owner: ai-platform
    runbook: docs/alerts.md#alert-3
